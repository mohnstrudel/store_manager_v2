# Pre-existing violations kept out of enforcement pending an explicit, reviewed
# decision — not a blanket exemption. Hand-written from evidence review, not
# generated by `rubocop --auto-gen-config`. Each entry names files, not the app.

# purchase_item.rb: product/variant belong to real, always-present FKs.
# sale_payment_part.rb: sale_payment_plan_id FK, plus the sequence uniqueness
# check this cop pairs with (see UniquenessOf below).
# Switching `belongs_to` to `db_belongs_to` adds a DB existence check on every
# save — a real behavior change on a write path, not an incidental lint fix.
DatabaseValidations/BelongsTo:
  Exclude:
    - app/models/purchase_item.rb
    - app/models/sale_payment_part.rb

# sale_payment_part.rb already uses `validates_db_uniqueness_of` for :sequence;
# the flagged :provider_part_id uniqueness check is conditional
# (`if: -> { provider_part_id.present? }`), which needs the same reviewed
# migration, not an automatic swap.
DatabaseValidations/UniquenessOf:
  Exclude:
    - app/models/sale_payment_part.rb

# spec/**/* is a permanent design decision (update_columns in test setup, not
# debt). The app/ files below skip validations deliberately on existing write
# paths (warehouse/expense mutation, purchase identity reconciliation,
# payment-plan recalculation). Switching to update!/save! adds validation and
# callback overhead and could raise on rows the current code writes
# regardless — a reviewed decision per call site, not a blanket rewrite.
Rails/SkipsModelValidations:
  Exclude:
    - spec/**/*
    - app/models/purchase_item/expenses.rb
    - app/models/purchase_item/linking.rb
    - app/models/purchase_item/shipping.rb
    - app/models/sale_payment_plan.rb
