name: Tests

on: [pull_request]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      RAILS_ENV: test
      REDIS_HOST: redis

    services:
      postgres:
        image: postgres
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout
          5s --health-retries 5
        ports: ["6379:6379"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install libvips
        run: >-
          sudo apt-get update -y && sudo apt-get install -y -qq libvips

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Use one test process per CPU
        run: echo "PARALLEL_TEST_PROCESSORS=$(nproc)" >> "$GITHUB_ENV"

      - name: Setup test DBs
        run: bundle exec rake parallel:create parallel:load_schema

      - name: Restore recorded spec runtimes
        uses: actions/cache@v4
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rspec-runtime-

      - name: Prepare assets (Tailwind)
        run: |
          bundle exec rails assets:precompile
      - name: Run backend lint
        run: bundle exec rubocop

      - name: Check generated TypeScript types
        run: |
          TYPELIZER=true bundle exec rails typelizer:generate:refresh
          git add --intent-to-add app/frontend/types/serializers
          git diff --exit-code -- app/frontend/types/serializers

      - name: Run backend tests
        run: bin/parallel-rspec spec
        env:
          PARALLEL_RSPEC_SKIP_SETUP: "1"

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        run: pnpm lint

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      - name: Run frontend tests
        run: pnpm exec vitest run
