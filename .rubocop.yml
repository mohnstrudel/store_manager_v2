inherit_from: .rubocop_todo.yml

require:
  - standard
  - database_validations/rubocop/cops

plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-slim
  - rubocop-factory_bot

inherit_gem:
  standard: config/base.yml
  standard-performance: config/base.yml

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - node_modules/**/*
    - public/**/*
    - vendor/**/*
    - bin/bundle
    - app/javascript/**/*
    - db/**/*

Rails:
  Enabled: true # enable rubocop-rails cops
Rails/I18nLocaleTexts:
  Enabled: false
Rails/UnknownEnv:
  Environments:
    - development
    - test
    - production
    - staging
Rails/DynamicFindBy:
  Whitelist:
    - find_by_shopify_id
    - find_by_woo_id
Layout/ClassStructure:
  Enabled: true
  ExpectedOrder:
    - module_inclusion
    - constants
    - macros
    - public_class_methods
    - initializer
    - public_methods
    - protected_methods
    - private_methods
  Categories:
    association:
      - has_many
      - has_one
    attribute_macros:
      - attr_accessor
      - attr_reader
      - attr_writer
    macros:
      - validates
      - validate
    module_inclusion:
      - include
      - prepend
      - extend
RSpec:
  Enabled: true # enable rubocop-rspec cops
RSpec/DescribeClass:
  Enabled: false # workflow/constraint/config specs (spec/integration, spec/config, cross-object reconciliation specs) that don't map to one class; request/feature specs are already exempted by the cop itself
RSpec/MultipleExpectations:
  Enabled: false # four-phase specs assert several facts about one behavior with aggregate_failures; ~400 examples rely on this
RSpec/MultipleMemoizedHelpers:
  Enabled: false # self-contained specs commonly need several related lets; ~190 examples rely on this
RSpec/ExampleLength:
  Enabled: false # four-phase specs with real setup are long by nature; ~700 examples rely on this
RSpec/SpecFilePathFormat:
  Enabled: false # capability-grouped spec subdirectories (e.g. spec/models/purchase_item/warehousing_spec.rb describing PurchaseItem) per the app/models/<model>/<capability> architecture
RSpec/MessageSpies:
  Enabled: false # expect(...).to receive(...) is the established verification style throughout the suite; ~30 examples rely on this
RSpec/AnyInstance:
  Enabled: false # used when the code under test loads its own instance internally with no exposed handle to stub directly (e.g. a job re-fetching a record from the DB)
RSpec/MessageChain:
  Enabled: false # stubs ActiveJob's .set(...).perform_later(...) two-step scheduling chain; no simpler single-message alternative
RSpec/LetSetup:
  Enabled: false # let! commonly creates background records for scope/query specs without being referenced directly in the example
RSpec/NestedGroups:
  Max: 5
RSpec/IndexedLet:
  Enabled: false # numeric-suffixed lets (size_1, size_2...) name genuinely interchangeable fixtures in multi-item scenarios
Bundler/DuplicatedGem:
  Enabled: false # ignore duplicated gem errors because we will have duplicated gems when dual booting

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always
