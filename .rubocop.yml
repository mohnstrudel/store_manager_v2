require:
  - standard
  - database_validations/rubocop/cops

plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-slim
  - rubocop-factory_bot

inherit_gem:
  standard: config/base.yml
  standard-performance: config/base.yml

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - node_modules/**/*
    - public/**/*
    - vendor/**/*
    - bin/bundle
    - app/javascript/**/*
    - db/**/*

Rails:
  Enabled: true # enable rubocop-rails cops
Rails/I18nLocaleTexts:
  Enabled: false
Rails/UnknownEnv:
  Environments:
    - development
    - test
    - production
    - staging
Rails/DynamicFindBy:
  Whitelist:
    - find_by_shopify_id
    - find_by_woo_id
Layout/ClassStructure:
  Enabled: true
  ExpectedOrder:
    - module_inclusion
    - constants
    - macros
    - public_class_methods
    - initializer
    - public_methods
    - protected_methods
    - private_methods
  Categories:
    association:
      - has_many
      - has_one
    attribute_macros:
      - attr_accessor
      - attr_reader
      - attr_writer
    macros:
      - validates
      - validate
    module_inclusion:
      - include
      - prepend
      - extend
RSpec:
  Enabled: true # enable rubocop-rspec cops
RSpec/DescribeClass:
  Enabled: false # ignore missing comments on classes
RSpec/MultipleExpectations:
  Enabled: false
RSpec/MultipleMemoizedHelpers:
  Enabled: false # ignore multiple memoized helpers
RSpec/ExampleLength:
  Enabled: false
RSpec/SpecFilePathFormat:
  Enabled: false # project uses subdirectory spec organization
RSpec/MessageSpies:
  Enabled: false
RSpec/AnyInstance:
  Enabled: false
RSpec/MessageChain:
  Enabled: false
RSpec/VerifiedDoubles:
  Enabled: false
RSpec/VerifiedDoubleReference:
  Enabled: false
RSpec/LetSetup:
  Enabled: false
RSpec/NestedGroups:
  Max: 5
RSpec/IndexedLet:
  Enabled: false
FactoryBot/ExcessiveCreateList:
  Enabled: false
Rails/SkipsModelValidations:
  Exclude:
    - spec/**/*
RSpec/StubbedMock:
  Enabled: false
Bundler/DuplicatedGem:
  Enabled: false # ignore duplicated gem errors because we will have duplicated gems when dual booting

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always
